<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borang Maklumat Peribadi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <p class="card-title">
        <span class="badge badge-a">A</span>
        Borang Input
      </p>
      <div id="formA">
        <div class="field-row">
          <span class="field-label">Nama</span>
          <input type="text" id="inNama" placeholder="Masukkan nama">
        </div>
        <div class="field-row">
          <span class="field-label">No KP</span>
          <input type="text" id="inKP" placeholder="e.g. 123456-78-9012">
        </div>
        <div class="field-row">
          <span class="field-label">No Matrik</span>
          <input type="text" id="inMatrik" placeholder="e.g. BD17245">
        </div>
        <div class="field-row">
          <span class="field-label">No Tel</span>
          <input type="text" id="inTel" placeholder="e.g. 0123456789">
        </div>
        <div class="field-row align-top">
          <span class="field-label top-pad">Alamat</span>
          <textarea id="inAlamat" placeholder="Masukkan alamat lengkap"></textarea>
        </div>
        <hr>
        <button class="btn-siap" onclick="submitForm()">Siap</button>
        <div class="error-msg" id="msgError">&#9888; Sila isi semua maklumat!</div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
